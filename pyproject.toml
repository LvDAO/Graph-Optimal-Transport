[project]
name = "graphot"
version = "0.0.2"
description = "Graph optimal transport on sparse reversible graphs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "LvDAO" },
]
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
]
keywords = [
  "optimal transport",
  "c++",
  "numpy",
  "scipy",
  "graphs",
  "wasserstein",
  "numerical optimization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = [
  "matplotlib>=3.10",
]

[project.urls]
Homepage = "https://github.com/LvDAO/Graph-Optimal-Transport"
Repository = "https://github.com/LvDAO/Graph-Optimal-Transport"
Issues = "https://github.com/LvDAO/Graph-Optimal-Transport/issues"
Documentation = "https://github.com/LvDAO/Graph-Optimal-Transport/tree/main/docs"

[dependency-groups]
dev = [
  "bump-my-version>=1.2.7",
  "matplotlib>=3.10",
  "pypdf>=6.7.5",
  "pytest>=8.3",
  "ruff>=0.12",
  "twine>=6",
]

[build-system]
requires = [
  "numpy>=2.1",
  "scikit-build-core>=0.10",
  "conan>=2.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.22"
wheel.packages = ["src/graphot"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
GRAPHOT_USE_CONAN = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""
markers = [
  "slow: longer-running integration and subprocess regression tests",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.bumpversion]
current_version = "0.0.2"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
commit = false
allow_dirty = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
